name: Sync Bunny Mods to Gitee
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */12 * * *'

env:
  SRC_REPO: JonataOliveira/BunnyLoader
  GITEE_USER: mo-ling22
  GITEE_REPO: Bunny-Loader-Mods
  TARGET_DIR: mods
  BATCH_COUNT: 8

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Install GitHub CLI
        run: |
          sudo apt update
          sudo apt install gh -y

      - name: Cache synced tags
        uses: actions/cache@v4
        with:
          path: ./synced_tags.txt
          key: ${{ github.workflow }}-taglist

      - name: Fetch latest release tags (分批，只取最新BATCH_COUNT个)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          touch synced_tags.txt
          gh api repos/${{ env.SRC_REPO }}/releases --jq '.[].tag_name' | head -n ${{ env.BATCH_COUNT }} > batch_tags.txt
          cat batch_tags.txt

      - name: Download new packages (分批)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ./pkg
          while read -r tag; do
            [ -z "$tag" ] && continue
            if grep -xF "$tag" synced_tags.txt; then
              echo "跳过已同步: $tag"
              continue
            fi
            echo "正在下载 $tag"
            mkdir -p ./pkg/${tag}
            gh release download "$tag" -R ${{ env.SRC_REPO }} -D ./pkg/${tag} -p "*.bl" --skip-existing
            echo "$tag" >> synced_tags.txt
          done < batch_tags.txt

      - name: Push to Gitee（适配现有main分支+mods文件夹）
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          git config --global http.postBuffer 524288000
          git config --global core.compression 0
          
          # 判断pkg是否为空
          if [ ! -d "./pkg" ] || [ -z "$(ls -A ./pkg)" ]; then
            echo "✅ 本次没有新模组，跳过推送"
            exit 0
          fi
          
          git clone https://${{ env.GITEE_USER }}:${GITEE_TOKEN}@gitee.com/${{ env.GITEE_USER }}/${{ env.GITEE_REPO }}.git repo
          cd repo
          # 直接在main分支，不切分支
          cp -r ../pkg/* ./${{ env.TARGET_DIR }}/
          git config user.name "bl-mirror-bot"
          git config user.email "bot@bl-mirror.local"
          git add .
          if git diff --cached --quiet; then
            echo "✅ 本次没有新增模组，结束推送"
            exit 0
          fi
          git commit -m "auto sync $(date -u +%Y-%m-%dT%H:%MZ)"
          git push origin main
