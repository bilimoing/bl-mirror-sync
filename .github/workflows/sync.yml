name: Sync Bunny Mods to GitCode
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

env:
  SRC_REPO: JonataOliveiraa/Bunny-Loader-Mods
  GITCODE_REPO: mmmmmhuuh/Bunny-Loader-Mods
  DEST_BRANCH: mods

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Update apt and install gh
        run: |
          sudo apt update -y
          sudo apt install gh -y
          gh --version
      - name: Cache synced tags
        id: tag_cache
        uses: actions/cache@v4
        with:
          path: ./synced_tags.txt
          key: ${{ github.workflow }}-taglist
      - name: Fetch release tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          touch synced_tags.txt
          echo "=== Fetching releases from ${{ env.SRC_REPO }} ==="
          gh api repos/${{ env.SRC_REPO }}/releases --paginate --jq '.[].tag_name' > all_tags.txt
          echo "=== Tag list ==="
          cat all_tags.txt
      - name: Download packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ./pkg
          while read -r tag; do
            [ -z "$tag" ] && continue
            if grep -xF "$tag" synced_tags.txt; then
              echo "Skip $tag"
              continue
            fi
            echo "Downloading $tag"
            mkdir -p ./pkg/${tag}
            gh release download "$tag" -R ${{ env.SRC_REPO }} -D ./pkg/${tag} -p "*.bl" --skip-existing
            echo "$tag" >> synced_tags.txt
          done < all_tags.txt
          ls -la ./pkg
      - name: Push to GitCode
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
        run: |
          cd ./pkg
          git init
          git config user.name "bl‑mirror‑bot"
          git config user.email "bot@blmirror.local"
          git add .
          if git diff --cached --quiet; then
            echo "✅ No new files, finish normally"
            exit 0
          fi
          git commit -m "auto sync $(date -u +%Y‑%m‑%dT%H:%MZ)"
          git remote add gitcode https://oauth2:${GITCODE_TOKEN}@gitcode.net/${{ env.GITCODE_REPO }}.git
          git push gitcode HEAD:${{ env.DEST_BRANCH }} --force
