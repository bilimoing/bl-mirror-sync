name: Sync Bunny Mods to Gitee
on:
  workflow_dispatch:
    inputs:
      full_sync:
        description: 全量同步（忽略已同步标记，逐个检查Gitee发行）
        type: boolean
        default: false
  schedule:
    - cron: '0 */6 * * *'

env:
  GH_TOKEN: ${{ github.token }}
  UPSTREAM_REPO: JonataOliveiraa/Bunny-Loader-Mods
  GITEE_REPO: mo-ling22/Bunny-Loader-Mods
  GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
  BATCH_COUNT: 100

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 用于推送tag到Gitee
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install GitHub CLI
        run: |
          sudo apt update
          sudo apt install gh jq -y
          gh --version
      - name: 初始化同步标记文件
        run: touch .synced_tags.txt
      - name: Cache synced tags
        uses: actions/cache@v4
        with:
          path: .synced_tags.txt
          key: ${{ runner.os }}-taglist-v3-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-taglist-v3-
      - name: 获取上游全部Release（分页）
        id: fetch_tags
        run: |
          all_releases=$(gh api --paginate repos/${{ env.UPSTREAM_REPO }}/releases)
          echo "$all_releases" | jq -r '.[].tag_name' > all_tags.txt
          cat all_tags.txt
      - name: Download & upload packages
        run: |
          while IFS= read -r tag; do
            if [ -z "$tag" ]; then continue; fi
            echo "===== 开始处理 tag: $tag ====="
            # 1. 查询Gitee是否已有该发行
            gitee_release_url="https://gitee.com/api/v5/repos/${{ env.GITEE_REPO }}/releases/tags/$tag?access_token=${{ env.GITEE_TOKEN }}"
            resp=$(curl -s -o gitee_resp.txt -w "%{http_code}" "$gitee_release_url" || true)
            echo "Gitee查询返回码: $resp"
            if [ "$resp" = "200" ] && [ "${{ github.event.inputs.full_sync }}" != "true" ]; then
              echo "✅ $tag 在Gitee已存在，跳过"
              continue
            fi
            echo "🔄 需要新建发行 $tag"
            # 2. 获取上游release完整信息
            rel=$(gh api repos/${{ env.UPSTREAM_REPO }}/releases/tags/$tag)
            body=$(echo $rel | jq -r '.body')
            name=$(echo $rel | jq -r '.name')
            commit_sha=$(echo $rel | jq -r '.target_commitish')
            echo "上游ref: $commit_sha"
            # 3. 创建Gitee tag，失败也继续
            curl -X POST https://gitee.com/api/v5/repos/${{ env.GITEE_REPO }}/git/tags \
              -F "access_token=${{ env.GITEE_TOKEN }}" \
              -F "tag_name=$tag" \
              -F "ref=$commit_sha" || true
            # 4. 创建Gitee发行，失败也继续
            release_resp=$(curl -X POST https://gitee.com/api/v5/repos/${{ env.GITEE_REPO }}/releases \
              -F "access_token=${{ env.GITEE_TOKEN }}" \
              -F "tag_name=$tag" \
              -F "name=$name" \
              -F "body=$body" || true)
            echo "Gitee创建发行返回：$release_resp"
            # 5. 下载附件
            mkdir -p ./assets
            echo $rel | jq -r '.assets[].browser_download_url' | while read url; do
              if [ -n "$url" ]; then
                echo "下载资产: $url"
                wget -q -P ./assets "$url" || true
              fi
            done
            # 6. 上传附件，单文件失败不打断循环
            for f in ./assets/*; do
              if [ -f "$f" ]; then
                echo "上传文件: $f"
                curl -X POST https://gitee.com/api/v5/repos/${{ env.GITEE_REPO }}/releases/attachments \
                  -F "access_token=${{ env.GITEE_TOKEN }}" \
                  -F "tag_name=$tag" \
                  -F "file=@$f" || true
              fi
            done
            rm -rf ./assets
            echo "$tag" >> .synced_tags.txt
            echo "===== 处理完毕 $tag ====="
          done < all_tags.txt
