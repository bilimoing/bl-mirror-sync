name: Sync Bunny Mods to Gitee
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */12 * * *'

env:
  SRC_REPO: JonataOliveira/BunnyLoader
  GITEE_USER: mo-ling22
  GITEE_REPO: Bunny-Loader-Mods
  BRANCH: mods

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Install GitHub CLI
        uses: cli/cli-action@v2

      - name: Cache synced tags
        uses: actions/cache@v4
        with:
          path: ./synced_tags.txt
          key: ${{ github.workflow }}-taglist

      - name: Fetch release tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          touch synced_tags.txt
          gh api repos/${{ env.SRC_REPO }}/releases --paginate --jq '.[].tag_name' > all_tags.txt
          cat all_tags.txt

      - name: Download new packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ./pkg
          while read -r tag; do
            [ -z "$tag" ] && continue
            if grep -xF "$tag" synced_tags.txt; then
              echo "跳过已同步: $tag"
              continue
            fi
            echo "正在下载 $tag"
            mkdir -p ./pkg/${tag}
            gh release download "$tag" -R ${{ env.SRC_REPO }} -D ./pkg/${tag} -p "*.bl" --skip-existing
            echo "$tag" >> synced_tags.txt
          done < all_tags.txt

      - name: Push to Gitee（增量）
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          # 克隆远端仓库，不是新建git仓库
          git clone https://${{ env.GITEE_USER }}:${GITEE_TOKEN}@gitee.com/${{ env.GITEE_USER }}/${{ env.GITEE_REPO }}.git repo
          cd repo
          git checkout ${{ env.BRANCH }}
          # 把新下载的包复制进去
          cp -r ../pkg/* ./
          git config user.name "bl-mirror-bot"
          git config user.email "bot@bl-mirror.local"
          git add .
          if git diff --cached --quiet; then
            echo "✅ 本次没有新增模组，结束推送"
            exit 0
          fi
          git commit -m "auto sync $(date -u +%Y-%m-%dT%H:%MZ)"
          git push origin ${{ env.BRANCH }}
