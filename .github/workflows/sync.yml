name: Sync Bunny Mods to GitCode
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

env:
  SRC_REPO: JonataOliveira/Bunny-Loader-Mods
  GITCODE_REPO: bilimoing/Bunny-Loader-Mods
  DEST_BRANCH: mods

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Install GitHub CLI (gh)
        run: sudo apt update && sudo apt install gh -y
      - name: Cache synced tags
        id: tag_cache
        uses: actions/cache@v4
        with:
          path: ./synced_tags.txt
          key: ${{ github.workflow }}-taglist
      - name: Fetch upstream release tags
        run: |
          touch synced_tags.txt
          gh api repos/${{ env.SRC_REPO }}/releases --paginate --jq '.[].tag_name' > all_tags.txt
      - name: Download bl packages and push
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
        run: |
          mkdir -p ./pkg
          while read -r tag; do
            [ -z "$tag" ] && continue
            if grep -xF "$tag" synced_tags.txt; then
              echo "✅ $tag already synced, skip"
              continue
            fi
            echo "🔄 Sync $tag"
            mkdir -p ./pkg/${tag}
            gh release download "$tag" -R ${{ env.SRC_REPO }} -D ./pkg/${tag} -p "*.bl" --skip-existing
            echo "$tag" >> synced_tags.txt
          done < all_tags.txt

          cd ./pkg
          git init
          git config user.name "bl-mirror-bot"
          git config user.email "bot@example.com"
          git add .
          git diff --cached --quiet || git commit -m "auto sync $(date -u +%Y-%m-%dT%H:%MZ)"
          git remote add gitcode https://oauth2:${GITCODE_TOKEN}@gitcode.net/${{ env.GITCODE_REPO }}.git
          git push gitcode HEAD:${{ env.DEST_BRANCH }} --force
