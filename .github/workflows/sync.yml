name: Sync Bunny Mods to Gitee
on:
  workflow_dispatch:
    inputs:
      full_sync:
        description: 全量同步（忽略缓存，逐个检查Gitee）
        type: boolean
        default: false
  schedule:
    - cron: '0 */6 * * *'

env:
  UPSTREAM_REPO: JonataOliveiraa/Bunny-Loader-Mods
  GITEE_REPO: mo-ling22/Bunny-Loader-Mods
  GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
  BATCH_COUNT: 20

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Set up job
        uses: actions/checkout@v4
      - name: Install GitHub CLI
        run: |
          sudo apt update
          sudo apt install gh
          gh --version
      - name: Cache synced tags
        uses: actions/cache@v4
        with:
          path: .synced_tags.txt
          key: ${{ runner.os }}-taglist-v2-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-taglist-v2-
      - name: Fetch latest release tags
        id: fetch_tags
        run: |
          gh api repos/${{ env.UPSTREAM_REPO }}/releases --per-page ${{ env.BATCH_COUNT }} | jq -r '.[].tag_name' > all_tags.txt
      - name: Download & upload packages
        run: |
          set -e
          while IFS= read -r tag; do
            if [ -z "$tag" ]; then continue; fi
            # 先查Gitee是否已经存在该发行
            resp=$(curl -s -o /dev/null -w "%{http_code}" https://gitee.com/api/v5/repos/${{ env.GITEE_REPO }}/releases/tags/$tag?access_token=${{ env.GITEE_TOKEN }})
            if [ "$resp" = "200" ] && [ "${{ github.event.inputs.full_sync }}" != "true" ]; then
              echo "✅ $tag 已存在于Gitee，跳过"
              continue
            fi
            echo "🔄 处理 $tag"
            # 拉取上游release信息
            rel=$(gh api repos/${{ env.UPSTREAM_REPO }}/releases/tags/$tag)
            body=$(echo $rel | jq -r '.body')
            name=$(echo $rel | jq -r '.name')
            # 下载附件
            mkdir -p ./assets
            echo $rel | jq -r '.assets[].browser_download_url' | while read url; do
              wget -q -P ./assets "$url"
            done
            # 创建Gitee发行并上传附件
            gitee_resp=$(curl -X POST https://gitee.com/api/v5/repos/${{ env.GITEE_REPO }}/releases \
              -F "access_token=${{ env.GITEE_TOKEN }}" \
              -F "tag_name=$tag" \
              -F "name=$name" \
              -F "body=$body")
            # 上传每个资产
            for f in ./assets/*; do
              if [ -f "$f" ]; then
                curl -X POST https://gitee.com/api/v5/repos/${{ env.GITEE_REPO }}/releases/attachments \
                  -F "access_token=${{ env.GITEE_TOKEN }}" \
                  -F "tag_name=$tag" \
                  -F "file=@$f"
              fi
            done
            rm -rf ./assets
            echo "$tag" >> .synced_tags.txt
          done < all_tags.txt
      - name: Post Cache synced tags
        uses: actions/cache@v4
        with:
          path: .synced_tags.txt
          key: ${{ runner.os }}-taglist-v2-${{ github.sha }}
